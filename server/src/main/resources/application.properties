server.address=127.0.0.1
server.port=8080
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.application.name=know-pool
spring.main.banner-mode=off
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
know-pool.data-directory=.runtime/data
know-pool.allowed-origins=http://127.0.0.1:4173,http://localhost:4173
logging.file.name=.runtime/logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
know-pool.upload.max-file-bytes=10485760
know-pool.upload.max-upload-bytes=104857600
know-pool.upload.max-upload-files=1000
know-pool.processing.parse-timeout-seconds=10
know-pool.processing.max-extracted-code-points=10485760
server.tomcat.max-part-count=1001
server.tomcat.max-parameter-count=10000
server.tomcat.max-part-header-size=32768
server.tomcat.max-swallow-size=104857600
