          },
          "403": {
            "$ref": "#/components/responses/403"
          },
          "404": {
            "$ref": "#/components/responses/404"
          },
          "409": {
            "$ref": "#/components/responses/409"
          },
          "413": {
            "$ref": "#/components/responses/413"
          },
          "415": {
            "$ref": "#/components/responses/415"
          },
          "422": {
            "$ref": "#/components/responses/422"
          },
          "429": {
            "$ref": "#/components/responses/429"
          },
          "500": {
            "$ref": "#/components/responses/500"
          },
          "503": {
            "$ref": "#/components/responses/503"
          }
        },
        "security": [
          {
            "localSession": []
          }
        ],
        "description": "200 表示已逐项处理，不保证全部成功。按完整文件名不区分大小写匹配，SHA-256 与大小一致跳过；变化生成内容版本并保持 fileId。新版本提交成功后立即取消旧任务；不同名不合并。提交时再次校验并发版本。逐项输入索引与结果索引对应。文件名首尾空白不自动修剪。 整请求结构、未知字段及文件数量先校验，失败返回400且不提交任何项目；总请求字节数含multipart封装开销，超过运行参数 maxUploadBytes 返回413及 RESOURCE_LIMIT且无项目提交。单份超过 maxFileBytes 则在200逐项结果中返回 failed及 RESOURCE_LIMIT；其他项目继续。批内同名组全组返回 failed及 CONFLICT，其他不重名项目继续。文本类资料采用严格UTF-8，允许UTF-8 BOM及空文件（大小为0），拒绝非法UTF-8和NUL；副本、哈希及大小使用未改写原始字节。不支持的单份媒体或内容返回逐项 failed及 UNSUPPORTED_FILE，整个请求不是multipart返回415。文件名非法返回逐项 failed及 INVALID_REQUEST。PDF须为可读取的文字PDF，加密或无可提取文字的PDF按不支持内容逐项失败。失败项不变更旧副本、元数据或任务。限额取运行参数，当前启动初值由工程实测记录，不以容器默认限制代替业务校验。",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "files"
                ],
                "properties": {
                  "files": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 1000,
                    "items": {
                      "type": "string",
                      "format": "binary"
                    }
                  }
                }
              },
              "encoding": {
                "files": {
                  "contentType": "application/pdf, text/markdown, text/plain"
                }
              }
            }
          }
        }
      }
    },
