    "/tasks/{taskId}/retry-cleanup": {
      "post": {
        "operationId": "retryCleanupTask",
        "summary": "重试已失败清理任务，保留逻辑删除且幂等清理",
        "tags": [
          "knowledge-bases"
        ],
        "parameters": [
          {
            "name": "taskId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "description": "",
              "minLength": 32
            },
            "description": "从本机会话初始化获得，只在内存保存"
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "description": "系统生成的稳定标识",
              "format": "uuid"
            },
            "description": "同会话同操作同键同负载返回原任务；负载不同返回409；映射随持久任务保留，运行期检索随该请求失效。 失败取消同键仍原任务，不重复调用；显式重试须新键；持久任务映射保留至任务删除，运行期检索映射保留至该请求失效；会话到期不允许用旧键重新提交。"
          }
        ],
        "responses": {
          "202": {
            "description": "操作成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TaskAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/400"
          },
          "401": {
            "$ref": "#/components/responses/401"
          },
          "403": {
            "$ref": "#/components/responses/403"
          },
          "404": {
            "$ref": "#/components/responses/404"
          },
          "409": {
            "$ref": "#/components/responses/409"
          },
          "422": {
            "$ref": "#/components/responses/422"
          },
          "429": {
            "$ref": "#/components/responses/429"
          },
          "500": {
            "$ref": "#/components/responses/500"
          },
          "503": {
            "$ref": "#/components/responses/503"
          }
        },
        "security": [
          {
            "localSession": []
          }
        ],
        "description": "只接受 kind=cleanup 且 state=failed，其他409；新任务关联原失败，不复活业务对象，只清理明确归属资源。"
      }
    },
