  "x-behavior-rules": [
    {
      "id": "规则-01",
      "description": "同数据集文件名不区分大小写，批内重名全组拒绝且无副作用。"
    },
    {
      "id": "规则-02",
      "description": "新内容提交后取消旧任务；同名哈希与大小一致不创建新版本。"
    },
    {
      "id": "规则-03",
      "description": "关联来源并集且排除优先；发布原子校验取消、内容、配置、关联与排除。"
    },
    {
      "id": "规则-04",
      "description": "配置变化整库切换，普通文件按库独立切换；指针与切换记录同事务。"
    },
    {
      "id": "规则-05",
      "description": "最后有效文件失效即下线，恢复和重建不自动发布。"
    },
    {
      "id": "规则-06",
      "description": "普通请求执行前重校验发布；部分范围不可用明确遗漏，全部不可用失败。"
    },
    {
      "id": "规则-07",
      "description": "问答最多一次预处理、三条附加查询、一次生成及一次校验，不自动重试收费调用。"
    },
    {
      "id": "规则-08",
      "description": "同会话一项活动任务；取消释放资格，但供应商仍在执行的请求继续占限流。"
    },
    {
      "id": "规则-09",
      "description": "同检索实例新提交取消旧请求，迟到结果不得覆盖，重启不自动检索。"
    },
    {
      "id": "规则-10",
      "description": "引用保存完整实际切片和当时名称；旧副本缺失不能冒充完整文件；检索快照仅运行期。"
    },
    {
      "id": "规则-11",
      "description": "维护路径、危险链接、暂停写入、复制校验、配置切换、清理旧目录顺序须真实验证。"
    },
    {
      "id": "规则-12",
      "description": "恢复仅建立缺失索引失败记录，显式重试才收费嵌入。"
    },
    {
      "id": "规则-13",
      "description": "凭据不回传不记录不前端持久化；保存显式凭据，不回退环境变量。"
    },
    {
      "id": "规则-14",
      "description": "整数不得超过 JavaScript 安全整数上限；拒绝数值字符串。"
    }
  ],
