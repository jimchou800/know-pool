{
  "openapi": "3.1.0",
  "info": {
    "title": "个人知识管理应用唯一接口契约",
    "version": "1.0.3",
    "description": "正式接口设计开发基线，批准证据由前后端在契约外分别记录同一字节摘要。设计完整不代表业务代码、自动校验或真实模型效果已实现。所有对象默认拒绝未知字段；服务端重校验关联、排除、发布、版本及取消资格。"
  },
  "servers": [
    {
      "url": "/api/v1",
      "description": "本机同源接口；开发由明确允许的代理访问"
    }
  ],
  "x-contract-status": "development-baseline",
  "x-business-constraints": {
    "filenameMatching": "仅同数据集完整文件名 Unicode NFC 后按 Locale.ROOT 小写比较，不修剪空白；后端统一比较键。NFC 是技术规范化，不更改展示文件名。",
    "nameMatching": "数据集与知识库分别去首尾 Unicode 空白，NFC 后 Locale.ROOT 小写唯一；实例名称允许重复。",
    "upload": "SHA-256 对原始字节，哈希与大小双一致跳过；独立保存不同名同内容；先提交新版本再取消旧任务。",
    "indexSwitch": "普通文件各库独立切换，配置变化整库统一切换；指针与记录同事务，旧请求固定快照。",
    "publication": "只有已发布参与普通知识服务；管理测试例外；最后有效文件失效立即自动下线；索引完成不自动发布。",
    "cost": "本轮未授权真实调用；运行时连接测试由明确用户操作触发。恢复索引不自动收费重嵌入。",
    "security": "仅回环监听，Host/Origin 白名单；会话Cookie和CSRF；SSE使用Cookie，令牌不进URL；无账号租户。",
    "maintenance": "路径拒绝同目录、互相包含、根目录、源码目录、危险链接；成功验证前不删旧数据；配置切换后清理失败保留新目录服务；Qdrant原生存储不迁移不备份。",
    "secrets": "凭据数据目录明文，不回传、不日志、不前端持久化、不环境变量兜底；备份含明文凭据。",
    "sse": "阶段和终态只通知；事实来源为任务查询；终态可重发，重连不创建新任务。"
  },
