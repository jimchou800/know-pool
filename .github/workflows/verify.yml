name: Local Application Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Build and Contract Verification
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Contract Tools
        run: python -m pip install -r scripts/contract/requirements.txt
      - name: Run Unified Verification
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload Verification Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            server/target/surefire-reports/
            server/target/site/jacoco/
            server/target/contract/
            front/coverage/
            front/artifacts/
            .scratch/technical-design/contract-reports/
