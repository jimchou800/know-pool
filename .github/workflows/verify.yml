name: Local Application Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Build and Runtime Verification
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Application
        run: mvn --batch-mode --no-transfer-progress package -Dmaven.test.skip=true
      - name: Verify Application Runtime
        run: python scripts/contract/run_live.py
      - name: Upload Verification Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          include-hidden-files: true
          path: |
            server/target/server-*.jar
            front/artifacts/
            .runtime/live-checks/*/startup.log
            .runtime/live-checks/*/application.log
